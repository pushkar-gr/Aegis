name: Aegis Pipeline

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'

jobs:
  # GO CONTROLLER
  controller-ci:
    name: Go Controller CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./controller 
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          check-latest: false
          cache: true

      - name: Verify go.sum is in sync
        run: go mod verify && go mod tidy -diff

      - name: Install Lint & Tools
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0

      - name: Lint (golangci-lint)
        run: golangci-lint run

      - name: Test
        run: go test -v ./...

      - name: Build Binary
        run: go build -o bin/aegis-controller .

  controller-vuln-scan:
    name: Go Vulnerability Scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./controller
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: controller/go.mod
          check-latest: false
          cache: true

      - name: Vulnerability Check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...

  # RUST AGENT
  agent-ci:
    name: Rust Agent & BPF Safety
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./agent
    steps:
      - uses: actions/checkout@v4

      - name: Install System Deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm libbpf-dev libelf-dev pkg-config \
            linux-tools-common build-essential protobuf-compiler
      
      - name: Install bpftool (static binary, kernel-independent)
        run: |
          BPFTOOL_VERSION=v7.5.0
          curl -sL "https://github.com/libbpf/bpftool/releases/download/${BPFTOOL_VERSION}/bpftool-${BPFTOOL_VERSION}-amd64.tar.gz" \
            | tar -xz
          sudo mv bpftool /usr/local/bin/bpftool
          sudo chmod +x /usr/local/bin/bpftool
          bpftool version
      
      - name: Generate vmlinux.h
        run: |
          echo "Generating vmlinux.h from CI runner kernel..."
          bpftool btf dump file /sys/kernel/btf/vmlinux format c > src/bpf/vmlinux.h

      - name: Install pinned Rust toolchain (reads rust-toolchain.toml)
        run: rustup show

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent

      - name: Check Formatting
        run: cargo fmt -- --check

      - name: Linting (Clippy)
        run: cargo clippy --locked -- -D warnings

      - name: Build Agent
        run: cargo build --locked --verbose

      - name: Verify eBPF Safety (Dry Run)
        continue-on-error: true
        run: |
          echo "Compiling C source for verification..."
          clang -g -O2 -target bpf -D__TARGET_ARCH_x86 -c src/bpf/aegis.bpf.c -o aegis_verify.o
          
          echo "Attempting to load into kernel to trigger Verifier..."
          sudo bpftool prog load aegis_verify.o /sys/fs/bpf/aegis_check type xdp
          
          echo "Success: Kernel Verifier accepted the program!"
          sudo rm /sys/fs/bpf/aegis_check

      - name: Run Unit Tests
        run: cargo test --locked --verbose

  agent-vuln-scan:
    name: Rust Vulnerability Scan (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: ./agent
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain (reads rust-toolchain.toml)
        run: rustup show
      - name: Install cargo-audit (pinned)
        run: cargo install cargo-audit --version 0.21.2 --locked
      - name: Audit dependencies
        run: cargo audit

  # NFRA CONFIGURATION
  integration-ci:
    name: Infra Configuration Check
    needs: [controller-ci, agent-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Validate Docker Compose
        run: docker compose -f deploy/docker-compose.yml config
